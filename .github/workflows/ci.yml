name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Each push to
# master gets a group of its own, so every merge runs in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Runs the mounting tests as the runner user, where Mount falls back to
  # fusermount3.
  #
  # Only this job saves the Go build cache. The first job to finish saves the
  # entry for a key, and every later run restores it, so a job that builds
  # less would leave the others compiling from scratch.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOUNT_USER: runner

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: &go-cache-path |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: &go-cache-key go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
    - name: Build
      run: go build ./...
    # composites reports unkeyed fusekernel.Protocol literals older than the
    # fork.
    - name: Vet
      run: go vet -composites=false ./...
    # A 32-bit int catches wire lengths that overflow it. The race detector
    # does not support 386.
    - name: Test (386)
      run: GOARCH=386 go test -count=1 ./...
    - &setup-fuse
      name: Set up FUSE
      run: |
        sudo apt-get update
        sudo apt-get install --yes fuse3
        test -c /dev/fuse
    # samples/flushfs runs go build, so root keeps the runner's PATH and HOME.
    - &mount-test
      name: Test
      env:
        FUSE_RUN_MOUNT_TESTS: "1"
      run: |
        set -o pipefail
        exec_flag=()
        if [ "$MOUNT_USER" = root ]; then
          exec_flag=(-exec "sudo env PATH=$PATH HOME=$HOME FUSE_RUN_MOUNT_TESTS=1")
        fi
        go test "${exec_flag[@]}" -race -count=1 -timeout 5m -json ./... \
          | tee "$RUNNER_TEMP/test.json" \
          | jq -rj 'select(.Action == "output") | .Output'
    # mounttest.SkipUnlessEnabled logs the marker in each test it lets run. A
    # broken gate skips every mounting test, and the step above passes.
    - &check-mounting-test
      name: Check that a mounting test passed
      run: |
        jq -se '
          (map(select(.Test and .Action == "output"
                      and (.Output | contains("FUSE_RUN_MOUNT_TESTS=1: mounting")))
               | [.Package, .Test]) | unique) as $mounting
          | any(.[]; .Test and .Action == "pass" and ([.Package, .Test] | IN($mounting[])))
        ' "$RUNNER_TEMP/test.json" > /dev/null || {
          echo "::error::no mounting test passed; check the FUSE_RUN_MOUNT_TESTS gate"
          exit 1
        }
    # Check the codebase has been formatted by `gofmt`.
    # We run two `gofmt` commands for different purposes:
    # 1. `gofmt -d .`: to print diffs in the CI log if any.
    # 2. `gofmt -l`: to test there is a diff in the codebase. This is because
    #    `gofmt` exits with exit status 0 even if there is a diff.
    #     This is recommended in https://github.com/golang/go/issues/24230)
    - name: Run gofmt
      run: |
        gofmt -d .
        test -z $(gofmt -l .)

  # Runs the mounting tests as root through sudo, where Mount mounts directly.
  linux-mount-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOUNT_USER: root

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: *go-cache-path
        key: *go-cache-key
    - *setup-fuse
    - *mount-test
    - *check-mounting-test

  # Mounting tests skip here: FUSE_RUN_MOUNT_TESTS is unset.
  macos:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    # The tests that load the installed MFMount framework fail here when
    # macFUSE is missing or older than 5.5. The runner image's Homebrew can
    # hold an older cask, so install the release the cask installs.
    - name: Install macFUSE
      env:
        MACFUSE_VERSION: 5.5.0
        MACFUSE_SHA256: 92c21ef2db4199bcf5bddc8e6efb57b23ecb9715f74ab38cba2c77ab226d3830
      run: |
        dmg="$RUNNER_TEMP/macfuse.dmg"
        curl -fsSL -o "$dmg" "https://github.com/macfuse/macfuse/releases/download/macfuse-$MACFUSE_VERSION/macfuse-$MACFUSE_VERSION.dmg"
        echo "$MACFUSE_SHA256  $dmg" | shasum -a 256 -c -
        hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/macfuse" "$dmg"
        sudo installer -pkg "$RUNNER_TEMP/macfuse/Extras/macFUSE $MACFUSE_VERSION.pkg" -target /
        hdiutil detach "$RUNNER_TEMP/macfuse"
    - name: Build
      run: go build ./...
    # composites reports unkeyed fusekernel.Protocol literals older than the
    # fork. unsafeptr reports the purego addresses that the FSKit fake and
    # probe convert to pointers.
    - name: Vet
      run: go vet -composites=false -unsafeptr=false ./...
    - name: Test
      run: go test -race -count=1 ./...

  # Builds and vets the consumer against this checkout, for Linux and darwin.
  artifact-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: fuse
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: dsfaccini/artifact-fs
        ref: main
        path: artifact-fs
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: artifact-fs/go.mod
        cache-dependency-path: artifact-fs/go.sum
    - name: Use this checkout
      working-directory: artifact-fs
      run: |
        go mod edit -replace github.com/dsfaccini/fuse=../fuse
        go mod tidy
        # Without this check, a build against the fuse that artifact-fs pins
        # would pass.
        if [ "$(go list -m -f '{{with .Replace}}{{.Path}}{{end}}' github.com/dsfaccini/fuse)" != ../fuse ]; then
          echo "::error::artifact-fs does not require github.com/dsfaccini/fuse"
          exit 1
        fi
    # A failed build is this checkout's fault only when artifact-fs main still
    # builds against the fuse it pins.
    - name: Build and vet
      working-directory: artifact-fs
      run: |
        check() {
          go build ./... && go vet ./... &&
            GOOS=darwin go build ./... && GOOS=darwin go vet ./...
        }
        check && exit 0
        echo "Building artifact-fs main against the fuse it pins."
        git checkout -- go.mod go.sum
        if check; then
          echo "::error::this checkout breaks artifact-fs main"
          exit 1
        fi
        echo "::warning::artifact-fs main is broken on its own"
