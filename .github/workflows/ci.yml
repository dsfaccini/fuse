name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    # Check the codebase has been formatted by `gofmt`.
    # We run two `gofmt` commands for different purposes:
    # 1. `gofmt -d .`: to print diffs in the CI log if any.
    # 2. `gofmt -l`: to test there is a diff in the codebase. This is because
    #    `gofmt` exits with exit status 0 even if there is a diff.
    #     This is recommended in https://github.com/golang/go/issues/24230)
    - name: Run gofmt
      run: |
        gofmt -d .
        test -z $(gofmt -l .)

  # Mounting tests skip here: FUSE_RUN_MOUNT_TESTS is unset.
  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    - name: Build
      run: go build ./...
    # composites and unsafeptr report existing findings in connection.go,
    # conversions.go and internal/buffer.
    - name: Vet
      run: |
        go vet -composites=false -unsafeptr=false ./...
        GOARCH=arm64 go vet -composites=false -unsafeptr=false ./...
    - name: Test
      run: go test -race -count=1 ./...
    # A 32-bit int catches wire lengths that overflow it. The race detector
    # does not support 386.
    - name: Test (386)
      run: GOARCH=386 go test -count=1 ./...

  # Runs the mounting tests twice: as the runner user, where Mount falls back
  # to fusermount3, and as root, where Mount mounts directly.
  linux-mount:
    name: linux-mount (${{ matrix.user }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        user: [runner, root]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    - name: Set up FUSE
      run: |
        sudo apt-get update
        sudo apt-get install --yes fuse3
        test -c /dev/fuse
    # samples/flushfs runs go build, so root keeps the runner's PATH and HOME.
    - name: Test
      env:
        FUSE_RUN_MOUNT_TESTS: "1"
        MOUNT_USER: ${{ matrix.user }}
      run: |
        set -o pipefail
        exec_flag=()
        if [ "$MOUNT_USER" = root ]; then
          exec_flag=(-exec "sudo env PATH=$PATH HOME=$HOME FUSE_RUN_MOUNT_TESTS=1")
        fi
        go test "${exec_flag[@]}" -race -count=1 -timeout 10m -json ./... \
          | tee "$RUNNER_TEMP/test.json" \
          | jq -rj 'select(.Action == "output") | .Output'
    # mounttest.SkipUnlessEnabled logs the marker in each test it lets run. A
    # broken gate skips every mounting test, and the step above passes.
    - name: Check that a mounting test passed
      run: |
        jq -se '
          (map(select(.Test and .Action == "output"
                      and (.Output | contains("FUSE_RUN_MOUNT_TESTS=1: mounting")))
               | [.Package, .Test]) | unique) as $mounting
          | any(.[]; .Test and .Action == "pass" and ([.Package, .Test] | IN($mounting[])))
        ' "$RUNNER_TEMP/test.json" > /dev/null || {
          echo "::error::no mounting test passed; check the FUSE_RUN_MOUNT_TESTS gate"
          exit 1
        }

  # Mounting tests skip here: FUSE_RUN_MOUNT_TESTS is unset.
  macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    # TestLoadFSKitAPIResolvesInstalledFramework loads the installed MFMount
    # framework, and fails here when it is missing.
    - name: Install macfuse
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install macfuse
    - name: Build
      run: go build ./...
    # composites and unsafeptr report existing findings in connection.go,
    # conversions.go and internal/buffer.
    - name: Vet
      run: go vet -composites=false -unsafeptr=false ./...
    - name: Test
      run: go test -race -count=1 ./...

  # Builds and vets the consumer against this checkout, for Linux and darwin.
  artifact-fs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: fuse
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: dsfaccini/artifact-fs
        ref: main
        path: artifact-fs
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: artifact-fs/go.mod
        cache-dependency-path: artifact-fs/go.sum
    - name: Use this checkout
      working-directory: artifact-fs
      run: |
        go mod edit -replace github.com/dsfaccini/fuse=../fuse
        go mod tidy
        # Without this check, a build against the fuse that artifact-fs pins
        # would pass.
        if [ "$(go list -m -f '{{with .Replace}}{{.Path}}{{end}}' github.com/dsfaccini/fuse)" != ../fuse ]; then
          echo "::error::artifact-fs does not require github.com/dsfaccini/fuse"
          exit 1
        fi
    - name: Build and vet
      working-directory: artifact-fs
      run: |
        go build ./...
        go vet ./...
        GOOS=darwin go build ./...
        GOOS=darwin go vet ./...
