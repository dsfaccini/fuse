name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    # Check the codebase has been formatted by `gofmt`.
    # We run two `gofmt` commands for different purposes:
    # 1. `gofmt -d .`: to print diffs in the CI log if any.
    # 2. `gofmt -l`: to test there is a diff in the codebase. This is because
    #    `gofmt` exits with exit status 0 even if there is a diff.
    #     This is recommended in https://github.com/golang/go/issues/24230)
    - name: Run gofmt
      run: |
        gofmt -d .
        test -z $(gofmt -l .)

  # Mounting tests skip here: FUSE_RUN_MOUNT_TESTS is unset.
  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    - name: Build
      run: go build ./...
    # composites and unsafeptr report existing findings in connection.go,
    # conversions.go and internal/buffer.
    - name: Vet
      run: |
        go vet -composites=false -unsafeptr=false ./...
        GOARCH=arm64 go vet -composites=false -unsafeptr=false ./...
    - name: Test
      run: go test -race ./...

  # Mounting tests skip here: FUSE_RUN_MOUNT_TESTS is unset.
  macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    # The FSKit tests load the installed MFMount framework.
    - name: Install macfuse
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install macfuse
    - name: Build
      run: go build ./...
    # composites and unsafeptr report existing findings in connection.go,
    # conversions.go and internal/buffer.
    - name: Vet
      run: go vet -composites=false -unsafeptr=false ./...
    - name: Test
      run: go test -race ./...

  # Builds and vets the consumer against this checkout, for Linux and darwin,
  # once per build tag artifact-fs still has.
  artifact-fs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: fuse
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: dsfaccini/artifact-fs
        ref: main
        path: artifact-fs
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: artifact-fs/go.mod
        cache-dependency-path: artifact-fs/go.sum
    - name: Use this checkout
      working-directory: artifact-fs
      run: |
        if ! go list -m github.com/dsfaccini/fuse; then
          echo "::error::artifact-fs does not require github.com/dsfaccini/fuse"
          exit 1
        fi
        go mod edit -replace github.com/dsfaccini/fuse=../fuse
        go mod tidy
    - name: Build and vet
      working-directory: artifact-fs
      run: |
        tags=("")
        if grep -rqE --include='*.go' '^//go:build .*\bfskit\b' .; then
          tags+=(fskit)
        fi
        for tag in "${tags[@]}"; do
          echo "::group::tags=\"$tag\""
          go build -tags "$tag" ./...
          go vet -tags "$tag" ./...
          GOOS=darwin go build -tags "$tag" ./...
          GOOS=darwin go vet -tags "$tag" ./...
          echo "::endgroup::"
        done
